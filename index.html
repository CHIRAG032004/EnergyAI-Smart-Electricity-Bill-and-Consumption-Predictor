<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnergyAI – Smart Electricity Bill & Consumption Predictor</title>
<style>
:root{--bg:#f6f8fc;--ink:#1e293b;--mute:#64748b;--line:#e8edf5;--blue:#2563eb;--amber:#f59e0b;--green:#10b981;--red:#ef4444}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.45;z-index:0;animation:float 14s ease-in-out infinite;pointer-events:none}
.b1{width:360px;height:360px;background:#fde68a;top:-90px;left:-70px}.b2{width:400px;height:400px;background:#bfdbfe;bottom:-110px;right:-90px;animation-delay:-6s}
@keyframes float{50%{transform:translate(40px,30px) scale(1.1)}}
.w{max-width:1100px;margin:auto;padding:0 18px;position:relative;z-index:1}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .w{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;cursor:pointer}.logo i{font-style:normal;background:linear-gradient(135deg,#fbbf24,#f59e0b);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(245,158,11,.16)}}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:600;color:var(--mute);cursor:pointer;font-size:14px;transition:.2s;position:relative}
nav button:hover{color:var(--ink);background:#f1f5f9}nav button.on{color:#b45309;background:#fef3c7}
#app>div{animation:up .5s both}@keyframes up{from{opacity:0;transform:translateY(16px)}}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;padding:56px 0 30px}@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:30px}}
.tag{display:inline-block;background:#fef3c7;color:#92400e;font-weight:700;font-size:13px;padding:6px 13px;border-radius:99px}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.1;margin:16px 0}.hero h1 span{background:linear-gradient(90deg,#f59e0b,#2563eb);-webkit-background-clip:text;color:transparent}
.hero p{color:var(--mute);font-size:17px;line-height:1.6;max-width:520px}
.mock{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 24px 60px rgba(37,99,235,.14);animation:bob 5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}
.mock .r{display:flex;gap:16px;align-items:center}.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--amber) 72%,#fde7b0 0);display:grid;place-items:center;flex:none}.ring b{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
.mini{display:flex;align-items:flex-end;gap:7px;height:90px;margin-top:18px}.mini i{flex:1;background:linear-gradient(#fbbf24,#f59e0b);border-radius:6px 6px 0 0;animation:grow 1.2s both,wave 3s ease-in-out infinite}
@keyframes grow{from{height:0!important}}@keyframes wave{50%{opacity:.7}}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:20px 0}
.sec{margin:40px 0 14px;font-size:26px}.sub{color:var(--mute);margin:0 0 16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(15,23,42,.04);transition:.25s;margin-bottom:14px}.grid .card,.strip .card{margin:0}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(15,23,42,.1)}.feat{cursor:pointer}.feat em{font-style:normal;font-size:30px;display:block;margin-bottom:8px}.feat h4{margin:0 0 6px}.feat p{margin:0;color:var(--mute);font-size:14px}
.kpi small{color:var(--mute);font-weight:600}.kpi b{display:block;font-size:30px;margin:6px 0 2px}.kpi span{font-size:12px;color:var(--mute)}
h3{margin:0 0 10px}canvas{width:100%;height:290px;display:block}
.lg{display:flex;gap:16px;font-size:12px;color:var(--mute);margin-top:8px;flex-wrap:wrap}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mute);font-size:12px;text-transform:uppercase}tr{animation:up .4s both}
.btn{border:0;background:var(--blue);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;cursor:pointer;transition:.2s;font-size:15px}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn.a{background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 8px 20px rgba(245,158,11,.4)}.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.o{background:#fff;color:var(--ink);border:1px solid var(--line)}
input[type=number],input[type=month]{padding:11px;border:1px solid var(--line);border-radius:10px;font-size:14px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:140px}label{font-size:12px;color:var(--mute);font-weight:600}
.chip{display:inline-block;padding:5px 11px;border-radius:99px;background:#fef3c7;color:#92400e;font-weight:600;font-size:12px;margin:0 6px 6px 0}.chip.b{background:#dbeafe;color:#1e40af}.chip.g{background:#d1fae5;color:#065f46}.chip.r{background:#fee2e2;color:#991b1b}
.sim{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}@media(max-width:800px){.sim{grid-template-columns:1fr}}
.ap{display:grid;grid-template-columns:34px 1fr 84px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.ap em{font-style:normal;font-size:24px}.ap input{width:100%;accent-color:var(--amber)}.ap small{color:var(--mute)}.ap b{text-align:right;font-size:13px}
.big{font-size:34px;font-weight:800;color:var(--green)}.stick{position:sticky;top:76px;align-self:start}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);animation:wd 1s both}@keyframes wd{from{width:0!important}}
.badge{padding:3px 9px;border-radius:8px;font-size:12px;font-weight:700}.sp{background:#fee2e2;color:#b91c1c}.dr{background:#dbeafe;color:#1d4ed8}
footer{margin-top:50px;border-top:1px solid var(--line);background:#fff;padding:22px 0;color:var(--mute);font-size:14px;position:relative;z-index:1}footer .w{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:#1e293b;color:#fff;padding:12px 20px;border-radius:12px;transition:.4s;z-index:99}#toast.show{transform:translate(-50%,0)}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="top"><div class="w"><div class="logo" onclick="go('home')"><i>⚡</i>EnergyAI</div>
<nav id="nav"><button data-t="home" class="on">🏠 Home</button><button data-t="dash">📊 Dashboard</button><button data-t="fc">🔮 Forecast</button><button data-t="sim">🧪 Simulator</button><button data-t="an">🚨 Anomalies</button><button data-t="up">📤 Upload</button><button data-t="data">🗄️ Data</button></nav></div></div>
<main class="w" id="app"></main>
<footer><div class="w"><span>⚡ EnergyAI · Smart Electricity Bill & Consumption Predictor</span><span>Offline demo · data stored in your browser · no internet needed</span></div></footer>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const inr=v=>'₹'+Math.round(v).toLocaleString('en-IN');
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mon=s=>{const[y,m]=s.split('-');return MN[m-1]+" '"+y.slice(2)};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};
/* ---------- offline database (localStorage) ---------- */
const rnd=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(7);
const gauss=()=>{let u=0;for(let i=0;i<6;i++)u+=rnd();return(u-3)*Math.SQRT2};
const p2=n=>String(n).padStart(2,'0'),ym=d=>d.getFullYear()+'-'+p2(d.getMonth()+1),iso=d=>ym(d)+'-'+p2(d.getDate());
const KEY='energyai_demo_v1';let D;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
function seed(){const t=new Date(),se=[-70,-60,-10,70,140,120,50,30,40,10,-45,-70],monthly={},daily={};
for(let k=0;k<36;k++){const d=new Date(t.getFullYear(),t.getMonth()+k-36,1);monthly[ym(d)]=+(300+1.6*k+se[d.getMonth()]+12*gauss()).toFixed(1)}
for(let i=90;i>0;i--){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-i);let u=15+(d.getDay()%6==0?1.5:0)+.8*gauss();if(i==70)u*=1.9;if(i==43)u*=.2;if(i==19)u*=2.3;daily[iso(d)]=+u.toFixed(1)}
const ap=[['Air Conditioner','❄️',1400,1,5],['Refrigerator','🧊',70,1,24],['Ceiling Fans','🌀',75,4,10],['LED Lights','💡',10,8,6],['Water Heater','🚿',2000,1,1],['Television','📺',100,1,4],['Washing Machine','🧺',500,1,1],['Laptop / PC','💻',80,1,6],['Water Pump','🚰',750,1,1]].map((a,i)=>({id:i+1,name:a[0],icon:a[1],watts:a[2],qty:a[3],hours:a[4]}));
D={monthly,daily,ap};save()}
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!D)seed();
/* ---------- analytics engine ---------- */
const md=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
function bill(u){let e=0,l=u;for(const[c,r]of[[100,3.5],[200,5],[1e9,7]]){const t=Math.min(l,c);e+=t*r;l-=t;if(l<=0)break}return+((e+50)*1.05).toFixed(2)}
function fcast(n=6){const r=Object.entries(D.monthly).sort(),N=r.length,ys=r.map(x=>x[1]),mx=(N-1)/2,my=ys.reduce((a,b)=>a+b)/N;let sx=0,sy=0;
ys.forEach((y,x)=>{sx+=(x-mx)*(y-my);sy+=(x-mx)**2});const b=sx/sy,a=my-b*mx,se={},cn={};
r.forEach(([m],i)=>{const k=+m.slice(5);se[k]=(se[k]||0)+ys[i]-(a+b*i);cn[k]=(cn[k]||0)+1});for(const k in se)se[k]/=cn[k];
const fit=r.map(([m],i)=>a+b*i+se[+m.slice(5)]),sd=Math.sqrt(fit.reduce((s,f,i)=>s+(ys[i]-f)**2,0)/N),mape=fit.reduce((s,f,i)=>s+Math.abs(f-ys[i])/ys[i],0)/N*100;
const[y,m]=r[N-1][0].split('-').map(Number),fc=[];
for(let i=1;i<=n;i++){const d=new Date(y,m-1+i,1),u=Math.max(a+b*(N-1+i)+(se[d.getMonth()+1]||0),0);fc.push({month:ym(d),units:+u.toFixed(1),lo:+Math.max(u-1.28*sd,0).toFixed(1),hi:+(u+1.28*sd).toFixed(1),bill:bill(u)})}
return{rows:r.map(([month,units])=>({month,units,bill:bill(units)})),fc,slope:+b.toFixed(2),mape:+mape.toFixed(1),sd:+sd.toFixed(1)}}
function dly(){const r=Object.entries(D.daily).sort(),v=r.map(x=>x[1]),med=md(v),mad=md(v.map(x=>Math.abs(x-med)))||1;
return{med:+med.toFixed(1),days:r.map(([day,units])=>{const z=(units-med)/(1.4826*mad);return{day,units,z:+z.toFixed(1),flag:Math.abs(z)>3.5,kind:z>0?'spike':'drop'}})}}
const kwh=(p,h=p.hours)=>p.watts*p.qty*h*30/1000;
function simu(h){const F=fcast(1).fc[0];let b=0,a=0;const per=D.ap.map(p=>{const k=kwh(p,h[p.id]??p.hours);b+=kwh(p);a+=k;return{id:p.id,after:+k.toFixed(1)}});
const s=b-a,nu=Math.max(F.units-s,0),sb=F.bill-bill(nu);return{base_bill:F.bill,new_bill:bill(nu),saved_units:+s.toFixed(1),saved_bill:sb,year:sb*12,co2:Math.round(s*.82*12),per}}
/* ---------- charts & helpers ---------- */
function anim(d,ms=1000){const t0=performance.now();(function f(t){const p=Math.min((t-t0)/ms,1);d(1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(f)})(t0)}
function count(){$$('[data-c]').forEach(el=>{const to=+el.dataset.c,pre=el.dataset.p||'',suf=el.dataset.x||'';anim(p=>el.textContent=pre+(to*p).toLocaleString('en-IN',{maximumFractionDigits:pre?0:1})+suf,900)})}
const kpi=(t,v,s,p='',x='')=>`<div class="card kpi"><small>${t}</small><b data-c="${v}" data-p="${p}" data-x="${x}">0</b><span>${s}</span></div>`;
function setup(cv){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;const x=cv.getContext('2d');x.scale(d,d);return[x,r.width,r.height]}
function grid(x,W,H,pl,pr,pt,pb,mx){x.font='11px sans-serif';x.fillStyle='#94a3b8';x.strokeStyle='#e8edf5';x.lineWidth=1;x.textAlign='right';for(let i=0;i<=4;i++){const y=H-pb-(H-pt-pb)*i/4;x.beginPath();x.moveTo(pl,y);x.lineTo(W-pr,y);x.stroke();x.fillText(Math.round(mx*i/4),pl-6,y+4)}}
function line(cv,L,Hs,F,lo,hi){const[x,W,H]=setup(cv),pl=46,pr=14,pt=14,pb=28,n=L.length,h=Hs.length,mx=Math.max(...Hs,...hi)*1.1;
const X=i=>pl+i*(W-pl-pr)/(n-1),Y=v=>H-pb-v/mx*(H-pt-pb);
anim(p=>{x.clearRect(0,0,W,H);grid(x,W,H,pl,pr,pt,pb,mx);x.textAlign='center';x.fillStyle='#94a3b8';for(let i=0;i<n;i+=Math.ceil(n/8))x.fillText(mon(L[i]),X(i),H-8);
x.save();x.beginPath();x.rect(0,0,pl+(W-pl)*p,H);x.clip();
x.beginPath();x.moveTo(X(h-1),Y(Hs[h-1]));F.forEach((_,i)=>x.lineTo(X(h+i),Y(hi[i])));for(let i=F.length-1;i>=0;i--)x.lineTo(X(h+i),Y(lo[i]));x.closePath();x.fillStyle='rgba(245,158,11,.16)';x.fill();
const g=x.createLinearGradient(0,pt,0,H-pb);g.addColorStop(0,'rgba(37,99,235,.28)');g.addColorStop(1,'rgba(37,99,235,0)');
const path=()=>{x.beginPath();Hs.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)))};
path();x.lineTo(X(h-1),H-pb);x.lineTo(X(0),H-pb);x.fillStyle=g;x.fill();path();x.strokeStyle='#2563eb';x.lineWidth=2.5;x.stroke();
x.beginPath();x.setLineDash([6,5]);x.moveTo(X(h-1),Y(Hs[h-1]));F.forEach((v,i)=>x.lineTo(X(h+i),Y(v)));x.strokeStyle='#f59e0b';x.stroke();x.setLineDash([]);
F.forEach((v,i)=>{x.beginPath();x.arc(X(h+i),Y(v),4.5,0,7);x.fillStyle='#f59e0b';x.fill()});x.restore()})}
function bars(cv,L,V,fl,col,lab){const[x,W,H]=setup(cv),pl=40,pr=10,pt=14,pb=26,n=V.length,mx=Math.max(...V)*1.12,bw=(W-pl-pr)/n;
anim(p=>{x.clearRect(0,0,W,H);grid(x,W,H,pl,pr,pt,pb,mx);V.forEach((v,i)=>{const h=v/mx*(H-pt-pb)*p;x.fillStyle=fl&&fl[i]?'#ef4444':col;x.beginPath();x.roundRect(pl+i*bw+bw*.15,H-pb-h,bw*.7,h,3);x.fill()});
x.fillStyle='#94a3b8';x.textAlign='center';for(let i=0;i<n;i+=Math.ceil(n/8))x.fillText(lab(L[i]),pl+i*bw+bw/2,H-8)})}
/* ---------- pages ---------- */
const API=location.protocol=='file:'?'http://127.0.0.1:8000':'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function upl(f){const box=$('#rep');box.innerHTML='<div class="card"><b>⏳ Analysing '+esc(f.name)+'…</b><div class="bar" style="margin-top:10px"><i style="width:100%"></i></div></div>';
let r;try{r=await(await fetch(API+'/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,content:await f.text()})})).json()}
catch(e){box.innerHTML='<div class="card"><b>⚠️ Backend not running.</b><p class="sub">Open a terminal in this folder, run <code>python server.py</code>, then upload again.</p></div>';return}
if(r.error){box.innerHTML='<div class="card"><b>⚠️ '+esc(r.error)+'</b></div>';return}
const d=await(await fetch(API+'/api/data')).json();if(r.kind=='monthly')D.monthly=d.monthly;else D.daily=d.daily;save();toast('Analysis complete · all tabs updated ✅');showRep(r.report)}
function showRep(r){const m=r.kind=='monthly';
$('#rep').innerHTML=`<div style="animation:up .5s both"><p class="sub">📄 <b>${esc(r.filename)}</b> · ${m?r.months+' months':r.days+' days'} · ${esc(r.period)} · detected as <b>${r.kind}</b> data</p>
<div class="grid">${kpi('Energy health score',r.score,r.grade,'','/100')}${kpi('Total consumption',r.total_units,esc(r.period),'',' kWh')}${m?kpi('Total bill ('+r.bill_source+')',r.total_bill,'avg ₹'+r.rate+' per unit','₹'):kpi('Projected monthly bill',r.proj_bill,r.proj_units+' kWh / month','₹')}${m?kpi('Next month forecast',r.fc[0].bill,r.fc[0].units+' kWh expected','₹'):kpi('Anomalies',r.anoms,'unusual days')}</div>
<div class="card" style="margin-top:14px"><h3>${m?'History & 6-month forecast':'Daily readings'}</h3><canvas id="c4"></canvas></div>
<div class="grid"><div class="card"><h3>🔎 Findings</h3>${r.findings.map(x=>`<p>• ${esc(x)}</p>`).join('')}</div><div class="card"><h3>💡 Recommendations</h3>${r.tips.map(x=>`<p>✅ ${esc(x)}</p>`).join('')}</div></div>
${m?`<div class="card"><h3>Forecast</h3><table><tr><th>Month</th><th>Units</th><th>Bill</th></tr>${r.fc.map(x=>`<tr><td>${mon(x.month)}</td><td>${x.units} kWh</td><td><b>${inr(x.bill)}</b></td></tr>`).join('')}</table></div>`:''}</div>`;count();
if(m)line($('#c4'),[...r.history.map(x=>x.month),...r.fc.map(x=>x.month)],r.history.map(x=>x.units),r.fc.map(x=>x.units),r.fc.map(x=>x.lo),r.fc.map(x=>x.hi));
else bars($('#c4'),r.series.map(x=>x.day),r.series.map(x=>x.units),r.series.map(x=>x.flag),'#60a5fa',s=>s.slice(5))}
let cur='home';
const T={
home(){const f=fcast(),l=f.rows[f.rows.length-1],n=f.fc[0];
$('#app').innerHTML=`<div><section class="hero"><div><span class="tag">⚡ AI-powered home energy</span><h1>Know your <span>electricity bill</span> before it arrives.</h1>
<p>Forecast monthly bills from your usage history, simulate appliance-level savings and catch unusual consumption — all running offline in your browser.</p><br>
<button class="btn a" onclick="go('dash')">Open Dashboard →</button> <button class="btn o" onclick="go('sim')">Try Simulator</button></div>
<div class="mock"><div class="r"><div class="ring"><b>72%</b></div><div><small style="color:var(--mute)">Next month forecast</small><div style="font-size:28px;font-weight:800">${inr(n.bill)}</div><span class="chip g">${n.units} kWh expected</span></div></div>
<div class="mini">${[40,55,48,70,90,80,60,45,58,66,50,72].map((h,i)=>`<i style="height:${h}%;animation-delay:${i*.08}s,${i*.2}s"></i>`).join('')}</div></div></section>
<div class="strip">${kpi('Months of history',f.rows.length,'stored in local database')}${kpi('Forecast accuracy',100-f.mape,'model fit (100 − MAPE)','','%')}${kpi('Appliances tracked',D.ap.length,'for savings simulation')}${kpi('Works offline',100,'no internet required','','%')}</div>
<h2 class="sec">Everything in one place</h2><p class="sub">Click a feature to open it.</p>
<div class="grid">${[['📊','Dashboard','dash','Usage, bills and forecast at a glance.'],['🔮','Bill Forecast','fc','6-month prediction with confidence range.'],['🧪','Savings Simulator','sim','Change appliance hours and see the new bill.'],['🚨','Anomaly Detection','an','Spot spikes and drops in daily usage.'],['📤','Upload & Analyse','up','Upload a bill CSV; the backend analyses it.'],['🗄️','Offline Database','data','Add readings, saved right in your browser.']].map(a=>`<div class="card feat" onclick="go('${a[2]}')"><em>${a[0]}</em><h4>${a[1]}</h4><p>${a[3]}</p></div>`).join('')}</div></div>`;count()},
dash(){const f=fcast(),h=f.rows,l=h[h.length-1],n=f.fc[0],d=((n.units-l.units)/l.units*100).toFixed(1),an=dly().days.filter(x=>x.flag).length;
$('#app').innerHTML=`<div><h2 class="sec">Home Energy Overview</h2><p class="sub">Your consumption, bills and next month's prediction.</p>
<div class="grid">${kpi('Last month ('+mon(l.month)+')',l.units,'units consumed','',' kWh')}${kpi('Last bill',l.bill,'slab-tariff estimate','₹')}${kpi('Next month forecast',n.bill,n.units+' kWh expected','₹')}${kpi('Anomalies found',an,'in last 90 days')}</div>
<div class="card" style="margin-top:14px"><h3>Consumption history & 6-month forecast</h3><canvas id="c1"></canvas><div class="lg"><span><i style="background:#2563eb"></i>Actual (kWh)</span><span><i style="background:#f59e0b"></i>Forecast</span><span><i style="background:#fde7b0"></i>80% confidence</span></div></div>
<div class="card"><h3>💡 Insight</h3><span class="chip ${d>0?'r':'g'}">${d>0?'▲':'▼'} ${Math.abs(d)}% vs last month</span><span class="chip b">Trend +${f.slope} kWh/month</span><span class="chip g">≈ ${Math.round(l.units*.82)} kg CO₂ last month</span>
<p>Usage is expected to ${d>0?'rise':'fall'} to <b>${n.units} kWh</b> (≈ <b>${inr(n.bill)}</b>) in ${mon(n.month)}. Try the <b>Simulator</b> to bring it down.</p></div></div>`;count();
const hh=h.slice(-24);line($('#c1'),[...hh.map(x=>x.month),...f.fc.map(x=>x.month)],hh.map(x=>x.units),f.fc.map(x=>x.units),f.fc.map(x=>x.lo),f.fc.map(x=>x.hi))},
fc(){const f=fcast(),mb=Math.max(...f.fc.map(x=>x.bill));
$('#app').innerHTML=`<div><h2 class="sec">Bill Forecast</h2><p class="sub">Linear trend + monthly seasonality, trained on ${f.rows.length} months of stored data.</p>
<div class="card"><span class="chip b">Model error (MAPE): ${f.mape}%</span><span class="chip">Std. deviation ±${f.sd} kWh</span><span class="chip g">Trend +${f.slope} kWh/mo</span><canvas id="c2"></canvas></div>
<div class="card"><h3>Next 6 months</h3><table><tr><th>Month</th><th>Units</th><th>Range</th><th>Bill</th><th></th></tr>${f.fc.map((x,i)=>`<tr style="animation-delay:${i*.07}s"><td>${mon(x.month)}</td><td>${x.units} kWh</td><td>${x.lo}–${x.hi}</td><td><b>${inr(x.bill)}</b></td><td style="width:28%"><div class="bar"><i style="width:${x.bill/mb*100}%"></i></div></td></tr>`).join('')}</table></div>
<div class="card"><h3>🧮 Quick bill calculator</h3><div class="row"><div><label>Units (kWh)</label><input type="number" id="cu" value="250"></div><button class="btn" id="cb">Calculate</button></div><p id="cr" class="big" style="color:var(--blue)"></p>
<p class="sub">Tariff: first 100 units ₹3.5 · next 200 ₹5.0 · above 300 ₹7.0 · ₹50 fixed + 5% duty.</p></div></div>`;
bars($('#c2'),f.fc.map(x=>x.month),f.fc.map(x=>x.units),null,'#f59e0b',mon);
$('#cb').onclick=()=>$('#cr').textContent=inr(bill(+$('#cu').value||0));$('#cb').click()},
sim(){const ap=D.ap;
$('#app').innerHTML=`<div><h2 class="sec">Appliance Savings Simulator</h2><p class="sub">Drag the daily-hours sliders and watch your next bill change.</p><div class="sim"><div class="card"><div class="row" style="margin-bottom:6px"><button class="btn g" id="eco">🌱 Eco preset (−25%)</button><button class="btn o" id="rs">↺ Reset</button></div>
${ap.map(a=>`<div class="ap"><em>${a.icon}</em><div><b style="font-size:14px">${a.name}</b> <small>${a.qty}× ${a.watts} W · <span id="h${a.id}">${a.hours}</span> h/day</small><input type="range" min="0" max="24" step="0.5" value="${a.hours}" id="s${a.id}" data-id="${a.id}"></div><b id="k${a.id}">${kwh(a).toFixed(1)} kWh</b></div>`).join('')}</div>
<div class="card stick"><h3>Estimated impact</h3><p class="sub">Next-month bill</p><div class="big" id="nb">–</div><p id="sv" class="sub"></p><span class="chip g" id="ys"></span><span class="chip b" id="co"></span><br><br><button class="btn a" id="ap">Save as my new routine</button></div></div></div>`;
const get=()=>Object.fromEntries($$('input[type=range]').map(e=>[e.dataset.id,+e.value]));
const run=()=>{const r=simu(get());$('#nb').textContent=inr(r.new_bill);$('#sv').innerHTML=`from <s>${inr(r.base_bill)}</s> · saves <b>${inr(r.saved_bill)}</b>/month (${r.saved_units} kWh)`;$('#ys').textContent='≈ '+inr(r.year)+' saved / year';$('#co').textContent='🌍 '+r.co2+' kg CO₂ / year';r.per.forEach(p=>$('#k'+p.id).textContent=p.after+' kWh')};
$$('input[type=range]').forEach(e=>e.oninput=()=>{$('#h'+e.dataset.id).textContent=e.value;run()});
$('#eco').onclick=()=>{ap.forEach(a=>{if(a.name!='Refrigerator'){const e=$('#s'+a.id);e.value=Math.round(a.hours*.75*2)/2;$('#h'+a.id).textContent=e.value}});run()};
$('#rs').onclick=()=>{ap.forEach(a=>{$('#s'+a.id).value=a.hours;$('#h'+a.id).textContent=a.hours});run()};
$('#ap').onclick=()=>{const h=get();D.ap.forEach(a=>a.hours=h[a.id]);save();toast('Routine saved ✅');T.sim()};run()},
an(){const r=dly(),d=r.days,fl=d.filter(x=>x.flag);
$('#app').innerHTML=`<div><h2 class="sec">Unusual Consumption Detection</h2><p class="sub">Robust z-score (median + MAD) over 90 days of daily readings. Typical day ≈ ${r.med} kWh.</p>
<div class="card"><div class="row" style="margin-bottom:10px"><button class="btn r" id="sp">⚡ Inject a spike</button><button class="btn o" id="rn">🔍 Re-run detection</button></div><canvas id="c3"></canvas><div class="lg"><span><i style="background:#60a5fa"></i>Normal</span><span><i style="background:#ef4444"></i>Anomaly</span></div></div>
<div class="card"><h3>${fl.length?'⚠️ '+fl.length+' unusual days':'✅ No anomalies'}</h3><table>${fl.map((x,i)=>`<tr style="animation-delay:${i*.08}s"><td>${x.day}</td><td>${x.units} kWh</td><td><span class="badge ${x.kind=='spike'?'sp':'dr'}">${x.kind=='spike'?'SPIKE':'DROP'}</span></td><td>z = ${x.z}</td></tr>`).join('')}</table><p class="sub">Spikes may mean a faulty appliance; drops may be an outage or meter issue.</p></div></div>`;
bars($('#c3'),d.map(x=>x.day),d.map(x=>x.units),d.map(x=>x.flag),'#60a5fa',s=>s.slice(5));
$('#sp').onclick=()=>{const last=Object.keys(D.daily).sort().pop(),n=new Date(last+'T00:00');n.setDate(n.getDate()+1);D.daily[iso(n)]=+(r.med*(rnd()>.5?2.2:2.6)).toFixed(1);save();toast('Spike injected');T.an()};
$('#rn').onclick=()=>{toast('Detection re-run');T.an()}},
up(){$('#app').innerHTML=`<div><h2 class="sec">Upload & Analyse</h2><p class="sub">Upload your electricity bill / readings as a CSV. The Python backend analyses it and updates every tab.</p>
<div class="card" id="dz" style="border:2px dashed #fbbf24;text-align:center;padding:36px;cursor:pointer"><div style="font-size:42px">📤</div><b>Drop your CSV here or click to browse</b><p class="sub" style="margin:8px 0 0">Monthly (2026-01) or daily (2026-01-31) data · columns: date/month, units, optional bill amount</p><input type="file" id="fi" accept=".csv,.txt" hidden></div><div id="rep"></div></div>`;
const dz=$('#dz'),fi=$('#fi');dz.onclick=()=>fi.click();fi.onchange=()=>fi.files[0]&&upl(fi.files[0]);
dz.ondragover=e=>{e.preventDefault();dz.style.background='#fffbeb'};dz.ondragleave=()=>dz.style.background='';
dz.ondrop=e=>{e.preventDefault();dz.style.background='';e.dataTransfer.files[0]&&upl(e.dataTransfer.files[0])}},
data(){const f=fcast(),h=[...f.rows].reverse().slice(0,12);
$('#app').innerHTML=`<div><h2 class="sec">Offline Database</h2><p class="sub">All data is saved in your browser's local storage — works with no internet.</p>
<div class="card"><h3>➕ Add monthly reading</h3><div class="row"><div><label>Month</label><input type="month" id="dm" value="${ym(new Date())}"></div><div><label>Units (kWh)</label><input type="number" id="du" placeholder="e.g. 320"></div><button class="btn a" id="da">Save</button></div></div>
<div class="card"><h3>Recent months <span class="chip">${f.rows.length} records</span></h3><table><tr><th>Month</th><th>Units</th><th>Bill</th></tr>${h.map((x,i)=>`<tr style="animation-delay:${i*.04}s"><td>${mon(x.month)}</td><td>${x.units}</td><td>${inr(x.bill)}</td></tr>`).join('')}</table><br><button class="btn r" id="dr">Reset demo data</button></div></div>`;
$('#da').onclick=()=>{const m=$('#dm').value,u=+$('#du').value;if(!m||!(u>0))return toast('Enter a valid month and units');D.monthly[m]=u;save();toast('Saved – forecast updated ✅');T.data()};
$('#dr').onclick=()=>{seed();toast('Demo data restored');T.data()}}};
function go(t){cur=t;$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));T[t]();scrollTo({top:0,behavior:'smooth'})}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};
let rt;onresize=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(['dash','fc','an'].includes(cur))T[cur]()},300)};
T.home();
</script></body></html>
